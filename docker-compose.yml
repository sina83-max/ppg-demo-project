name: ppg-demo

services:
  mock-ppg:
    build: ./mock_ppg
    container_name: ppg-demo-mock-ppg
    environment:
      LOG_LEVEL: ${MOCK_LOG_LEVEL:-INFO}
      UNKNOWN_ANSWER_RATE: ${MOCK_UNKNOWN_ANSWER_RATE:-0.0}
      # --- Database (inside the container, persisted via the volume below)
      DATABASE_URL: sqlite+aiosqlite:////data/mock_ppg.db
      # --- URLs
      # Browser-facing base; used to build pspSwitchingUrl.
      PUBLIC_BASE_URL: ${MOCK_PUBLIC_BASE_URL:-http://localhost:8001}
      # The merchant builds callbackUrl from MERCHANT_CALLBACK_BASE
      # (http://localhost:8000), which is correct for a browser and for real
      # Jibit PPG but unreachable from inside this container. The mock rewrites
      # the host to the compose service name when posting the callback.
      # Leave empty to disable the rewrite.
      CALLBACK_BASE_URL_OVERRIDE: ${MOCK_CALLBACK_BASE_URL_OVERRIDE:-http://merchant:8000}
    ports:
      # Host:container mapping – host port is configurable via .env
      - "${MOCK_PPG_PORT:-8001}:8001"
    volumes:
      - ./mock_ppg/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  merchant:
    build: ./merchant
    container_name: ppg-demo-merchant
    depends_on:
      mock-ppg:
        condition: service_healthy
    environment:
      # --- PPG target: mock by default.
      # For the real Jibit PPG change only these three values in .env
      # (see docs/AGENTS.md section 11) and restart the merchant service.
      PPG_BASE_URL: ${PPG_BASE_URL:-http://mock-ppg:8001}
      PPG_API_KEY: ${PPG_API_KEY:-mock-key}
      PPG_SECRET_KEY: ${PPG_SECRET_KEY:-mock-secret}
      # --- Merchant
      # Browser-facing base (used for links shown in the dashboard).
      # The mock PPG rewrites the host to http://merchant:8000 before posting
      # the callback; the real gateway receives this URL unchanged.
      MERCHANT_CALLBACK_BASE: ${MERCHANT_CALLBACK_BASE:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- Database (inside the container, persisted via the volume below)
      DATABASE_URL: sqlite+aiosqlite:////data/merchant.db
    ports:
      - "${MERCHANT_PORT:-8000}:8000"
    volumes:
      - ./merchant/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
